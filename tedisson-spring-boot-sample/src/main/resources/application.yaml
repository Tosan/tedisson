server:
  port: 8081

logging:
  level:
    com.tosan.client.redis: DEBUG

tedisson:
  local:
    cache-provider: caffeine
  redis:
    connection-type: single_node
    enabled: true
    username: default
    password:
    single-server:
      address: localhost:6379
      database: 10
    stream:
      enabled: false
      max-message-size: 10
      trim-rate-second: 10
      thread-pool:
        core-pool-size: 10
        queue-capacity: 10
        max-pool-size: 20
  redis-client-type: LETTUCE

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 10
      username: default
      password:
      timeout: 3s
      connect-timeout: 5s
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2s
        cluster:
          refresh:
            period: 30s
            dynamic-refresh-sources: true
      # Seed nodes. A non-empty list selects Lettuce cluster mode.
      cluster:
        max-redirects: 5
        nodes:
          - localhost:7000
          - localhost:7001
          - localhost:7002
